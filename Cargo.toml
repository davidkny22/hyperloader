[package]
name = "hyperloader-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native execution engine for hyperloader."

[lib]
name = "_hyperloader"
crate-type = ["cdylib", "rlib"]
path = "engine/src/lib.rs"

[[bench]]
name = "rng_floor"
harness = false

[dependencies]
getrandom = "0.3.4"
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }
