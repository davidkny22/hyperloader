[package]
name = "hyperloader-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native execution engine for hyperloader."

[lib]
name = "_hyperloader"
crate-type = ["cdylib", "rlib"]
path = "engine/src/lib.rs"

[[bench]]
name = "rng_floor"
harness = false

[dependencies]
getrandom = "0.3.4"
pyo3 = { version = "0.27", features = ["extension-module"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }
